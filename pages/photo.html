<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Фотографії тапірів">
  <title>Фотографії тапірів</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Swiper JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  <style type="text/tailwindcss">
    @layer components {
      .custom-green-theme {
        @apply bg-green-50;
      }
      .custom-green-theme a:hover {
        @apply text-green-800 underline;
      }
      .swiper {
        @apply w-full h-[70vh] rounded-lg shadow-lg;
      }
      .swiper-slide {
        @apply flex justify-center items-center bg-gray-100;
      }
      .swiper-slide img {
        @apply block w-full h-full object-contain;
      }
      .swiper-button-prev,
      .swiper-button-next {
        @apply text-green-600 bg-white/80 p-4 rounded-full hover:bg-white transition-colors;
      }
      .swiper-pagination-bullet {
        @apply bg-gray-400 opacity-100;
      }
      .swiper-pagination-bullet-active {
        @apply bg-green-600;
      }
    }
  </style>
</head>
<body class="custom-green-theme">
  <header class="text-center bg-green-600 text-white py-3 shadow-md">
    <h1 class="text-3xl font-bold mb-2">Фотографії тапірів</h1>
    <nav class="flex flex-wrap justify-center gap-4 md:gap-6 py-2">
      <a href="../index.html" class="text-white hover:bg-green-700 px-3 py-1 rounded transition-colors">Головна</a>
      <a href="morphology.html" class="text-white hover:bg-green-700 px-3 py-1 rounded transition-colors">Зовнішній вигляд</a>
      <a href="nutrition.html" class="text-white hover:bg-green-700 px-3 py-1 rounded transition-colors">Харчування</a>
      <a href="population.html" class="text-white hover:bg-green-700 px-3 py-1 rounded transition-colors">Ареал</a>
    </nav>
  </header>

  <main class="container mx-auto px-4 py-6 max-w-6xl">
    <!-- Slider main container -->
    <div class="swiper">
      <!-- Additional required wrapper -->
      <div class="swiper-wrapper">
        <!-- Slides -->
        <div class="swiper-slide">
          <a href="../images/tapir2.jpg" target="_blank">
            <img src="../images/tapir2.jpg" alt="Тапір 1">
          </a>
        </div>
        <div class="swiper-slide">
          <a href="../images/tapir_carusel1.jpg" target="_blank">
            <img src="../images/tapir_carusel1.jpg" alt="Тапір 2">
          </a>
        </div>
        <div class="swiper-slide">
          <a href="../images/tapir_3.jpg" target="_blank">
            <img src="../images/tapir_3.jpg" alt="Тапір 3">
          </a>
        </div>
        <div class="swiper-slide">
          <a href="../images/tapir4.jpg" target="_blank">
            <img src="../images/tapir4.jpg" alt="Тапір 4">
          </a>
        </div>
        <div class="swiper-slide">
          <a href="../images/tapir5.webp" target="_blank">
            <img src="../images/tapir5.webp" alt="Тапір 5">
          </a>
        </div>
        <div class="swiper-slide">
          <a href="../images/tapir6.jpg" target="_blank">
            <img src="../images/tapir6.jpg" alt="Тапір 6">
          </a>
        </div>
      </div>
      <!-- Pagination -->
      <div class="swiper-pagination"></div>
      <!-- Navigation buttons -->
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
    </div>
  </main>

  <footer class="text-center bg-gray-800 text-white py-3 mt-6">
    <p>&copy; 2025 Сайт про тапірів</p>
  </footer>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const swiper = new Swiper('.swiper', {
      // Optional parameters
      loop: true,
      autoplay: {
        delay: 3000,
      },
      
      // Pagination
      pagination: {
        el: '.swiper-pagination',
        clickable: true,
      },
      
      // Navigation arrows
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
      },
    });
  </script>
</body>
</html>
